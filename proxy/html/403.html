<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B5 WAF — Access Denied</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .shield {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .shield-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .brand { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: 0.05em; }
    .brand span { color: #e74c3c; }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .detail-grid {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .detail-row {
      display: flex;
      gap: 0.75rem;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      align-items: flex-start;
    }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      min-width: 90px;
      padding-top: 1px;
    }

    .detail-value {
      font-size: 0.875rem;
      color: #cbd5e1;
      word-break: break-all;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.35);
      color: #e74c3c;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .footer {
      border-top: 1px solid #2d3148;
      padding-top: 1.25rem;
      font-size: 0.8rem;
      color: #475569;
      line-height: 1.6;
    }

    .ref { color: #64748b; font-family: monospace; font-size: 0.78rem; }

    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.25rem; }
      .detail-row { flex-direction: column; gap: 0.25rem; }
      .detail-label { min-width: unset; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">
      <div class="shield-icon">🛡</div>
      <span class="brand">B5 <span>WAF</span></span>
    </div>

    <h1>Access Denied</h1>
    <p class="subtitle">
      Your request was blocked by the B5 Web Application Firewall.<br>
      If you believe this is a mistake, contact your administrator.
    </p>

    <div class="detail-grid">
      <div class="detail-row">
        <span class="detail-label">Reason</span>
        <span class="detail-value"><span class="badge">{{attack_type}}</span></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Detail</span>
        <span class="detail-value">{{detail}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Your IP</span>
        <span class="detail-value">{{ip}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">URI</span>
        <span class="detail-value">{{uri}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Time</span>
        <span class="detail-value">{{timestamp}} UTC</span>
      </div>
    </div>

    <div class="footer">
      Reference ID: <span class="ref">{{request_id}}</span>
    </div>
  </div>
</body>
</html>
