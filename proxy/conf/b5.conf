server {
    listen       80;
    server_name  localhost;

    # Core B5 inspection phase (WAF checks + CORS preflight)
    access_by_lua_file lua/access.lua;

    # Append CORS headers to every non-preflight response
    header_filter_by_lua_block {
        require("cors_handler").set_headers()
    }

    location / {
        # Proxy traffic to the dummy backend app
        proxy_pass http://dummy-app:80;
        
        # Forward original IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 403 responses are rendered by block_response.lua (proxy/lua/block_response.lua)
    # using the template at proxy/html/403.html — no static error_page needed here.
}
