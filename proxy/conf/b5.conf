upstream b5_backend {
    server dummy-app:80;
    keepalive 32;           # persistent connections back to the app
}

server {
    listen       80;
    server_name  localhost;

    # Core B5 inspection phase (WAF checks + CORS preflight)
    access_by_lua_file lua/access.lua;

    # Append CORS headers to every non-preflight response
    header_filter_by_lua_block {
        require("cors_handler").set_headers()
    }

    # ── Health check endpoint ──────────────────────────────────────────────────
    # Returns WAF status as JSON; skips WAF/CORS pipeline entirely.
    location = /healthz {
        access_log  off;
        content_by_lua_block {
            local cfg = _G.B5_CONFIG or {}
            local cjson = require "cjson.safe"
            local body = cjson.encode({
                status  = "ok",
                service = "b5-waf",
                mode    = cfg.mode or "unknown",
                version = "1.0.0",
                time    = ngx.utctime(),
            })
            ngx.status = 200
            ngx.header["Content-Type"] = "application/json"
            ngx.header["Cache-Control"] = "no-store"
            ngx.say(body)
        }
    }

    location / {
        # Proxy traffic through the named upstream (keepalive + failover)
        proxy_pass http://b5_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # required for upstream keepalive

        # Forward original IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Failover: retry on connection failure or bad gateway (idempotent methods)
        proxy_next_upstream     error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout   3s;
        proxy_read_timeout      30s;
    }

    # ── Backend unavailable ────────────────────────────────────────────────────
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        content_by_lua_block {
            local cjson = require "cjson.safe"
            ngx.status = 503
            ngx.header["Content-Type"] = "application/json"
            ngx.header["Retry-After"] = "10"
            ngx.say(cjson.encode({
                status  = "error",
                code    = 503,
                message = "Backend unavailable. Please try again shortly.",
            }))
        }
    }

    # 403 responses are rendered by block_response.lua (proxy/lua/block_response.lua)
    # using the template at proxy/html/403.html — no static error_page needed here.
}
