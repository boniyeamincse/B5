server {
    listen       80;
    server_name  localhost;

    # Core B5 inspection phase
    access_by_lua_file lua/access.lua;

    location / {
        # Proxy traffic to the dummy backend app
        proxy_pass http://dummy-app:80;
        
        # Forward original IP and headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages for blocked traffic
    error_page 403 /403.html;
    location = /403.html {
        internal;
        default_type text/html;
        return 403 "<html><head><title>B5 WAF - Access Denied</title><style>body{font-family:sans-serif;text-align:center;padding:50px;background:#f4f4f9;color:#333;}h1{color:#e74c3c;}</style></head><body><h1>Access Denied</h1><p>Your request has been blocked by the B5 Web Application Firewall.</p></body></html>";
    }
}
